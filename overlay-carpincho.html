<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inicio carpincho gamer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rubik:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: #0d0a24; }
  #world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
  #world > * { position: absolute; }
  svg { display: block; }

  .rgb { animation: hue 9s linear infinite; }
  @keyframes hue { to { filter: hue-rotate(360deg); } }
  .fan { transform-box: fill-box; transform-origin: center; animation: spin 2.4s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .blink { animation: blink 3s ease-in-out infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

  /* Pantalla de la tele */
  #screen {
    left: 130px; top: 185px; width: 940px; height: 529px; border-radius: 10px; overflow: hidden;
    background: linear-gradient(135deg, #0a0c1c 0%, #05060c 60%, #0b0f24 100%);
  }
  #screen .glare { position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,0) 38%); }
  #screenOn { position: absolute; inset: 0; opacity: 0; animation: noise .5s steps(1) infinite; }
  #screenOn::after {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0 2px, rgba(0,0,0,0) 2px 5px);
  }
  #screenOn .bar { position: absolute; left: 0; right: 0; height: 60px; background: linear-gradient(0deg, rgba(255,255,255,0), rgba(255,255,255,.18), rgba(255,255,255,0)); animation: bar 1.6s linear infinite; }
  @keyframes bar { from { top: -80px; } to { top: 520px; } }
  @keyframes noise {
    0% { background-position: 0 0; } 20% { background-position: -60px 40px; } 40% { background-position: 30px -70px; }
    60% { background-position: -90px -20px; } 80% { background-position: 70px 60px; }
  }

  /* Carpincho */
  #capy { left: 1260px; top: 345px; width: 500px; transform: translateY(-1100px); }
  #capy, #capyTilt, #capyBreath { transform-origin: 50% 100%; }
  #capyBreath { position: relative; }
  #capyBreath img { display: block; width: 500px; height: auto; }
  #shine { position: absolute; inset: 0; pointer-events: none; }
  #shine div {
    position: absolute; inset: 0;
    background: linear-gradient(115deg, rgba(255,255,255,.65) 0%, rgba(255,255,255,.15) 55%, rgba(255,255,255,0) 100%);
    mix-blend-mode: screen; opacity: 0;
  }

  /* Video (capa fuera del mundo, ya en tamaño final) */
  #video {
    position: absolute; left: 130px; top: 185px; width: 940px; height: 529px; border-radius: 10px; overflow: hidden;
    background: #000; opacity: 0; pointer-events: none;
  }
  #video iframe, #video #yt { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #demoVid {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center; text-align: center;
    background: linear-gradient(135deg, #ff2bd6, #00e5ff, #ffe600); color: #fff;
    font: 120px 'Bungee', Impact, sans-serif; text-shadow: 0 6px 20px rgba(0,0,0,.5);
  }
  #dbg { position: absolute; left: 16px; bottom: 12px; color: #fff; font: 20px 'Rubik', Arial, sans-serif; background: rgba(0,0,0,.6); padding: 6px 10px; border-radius: 6px; display: none; }

  /* "Ya comenzamos" sobre el video */
  #titleWrap { position: absolute; left: 130px; top: 185px; width: 940px; height: 529px; z-index: 50; pointer-events: none; display: flex; align-items: flex-end; justify-content: center; }
  #title {
    margin-bottom: 56px; opacity: 0;
    font-family: 'Bungee', Impact, sans-serif; font-size: 100px; line-height: 1; text-transform: uppercase; white-space: nowrap; color: #fff;
    text-shadow: 0 0 6px #fff, 0 0 16px #ff2bd6, 0 0 34px #ff2bd6, 0 0 64px #ff2bd6, 0 6px 22px rgba(0,0,0,.8);
  }
  #video { z-index: 5; }
  #glare2 { left: 130px; top: 185px; width: 940px; height: 529px; border-radius: 10px; z-index: 7; pointer-events: none; background: linear-gradient(115deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,0) 38%); }
</style>
</head>
<body>
<div id="stage">

  <div id="world">

    <!-- Habitación -->
    <svg id="room" style="left:0;top:0" width="1920" height="1080" viewBox="0 0 1920 1080">
      <defs>
        <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d1447"/><stop offset="1" stop-color="#0d0a24"/></linearGradient>
        <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241a52"/><stop offset="1" stop-color="#0c0820"/></linearGradient>
        <linearGradient id="rgbg" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#ff2bd6"/><stop offset=".33" stop-color="#7a5cff"/><stop offset=".66" stop-color="#00e5ff"/><stop offset="1" stop-color="#38ff6b"/>
        </linearGradient>
        <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#fff" stroke-opacity=".035" stroke-width="2"/></pattern>
        <pattern id="stripes" width="90" height="90" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><rect width="45" height="90" fill="#fff" opacity=".04"/></pattern>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
        <filter id="glowS" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
        <radialGradient id="vignette" cx=".5" cy=".5" r=".78"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
      </defs>

      <rect width="1920" height="880" fill="url(#wall)"/>
      <rect width="1920" height="880" fill="url(#grid)"/>
      <rect y="860" width="1920" height="20" fill="#2a1f58"/>
      <rect y="880" width="1920" height="200" fill="url(#floor)"/>
      <ellipse cx="960" cy="985" rx="900" ry="85" fill="#3a2b7a" opacity=".45"/>
      <ellipse cx="960" cy="985" rx="900" ry="85" fill="url(#stripes)"/>

      <!-- tira LED en el techo -->
      <g class="rgb">
        <rect x="0" y="0" width="1920" height="14" fill="url(#rgbg)" filter="url(#glowS)"/>
        <rect x="0" y="0" width="1920" height="6" fill="url(#rgbg)"/>
      </g>

      <!-- cartel neón -->
      <g>
        <rect x="1300" y="70" width="500" height="120" rx="26" fill="none" stroke="#00e5ff" stroke-width="6" filter="url(#glowS)"/>
        <rect x="1300" y="70" width="500" height="120" rx="26" fill="none" stroke="#bff6ff" stroke-width="3"/>
        <text x="1550" y="152" text-anchor="middle" font-family="Bungee, Impact, sans-serif" font-size="64" fill="#ff2bd6" filter="url(#glowS)">GAME ON</text>
        <text x="1550" y="152" text-anchor="middle" font-family="Bungee, Impact, sans-serif" font-size="64" fill="#ffd6f6">GAME ON</text>
      </g>

      <!-- pósters -->
      <g>
        <rect x="1310" y="215" width="120" height="110" rx="6" fill="#120d30" stroke="#3b2d78" stroke-width="4"/>
        <path d="M1320 316 L1355 254 L1378 288 L1400 246 L1422 316 Z" fill="#7a5cff" opacity=".85"/><circle cx="1396" cy="238" r="9" fill="#ff2bd6"/>
        <rect x="1455" y="215" width="120" height="110" rx="6" fill="#120d30" stroke="#3b2d78" stroke-width="4"/>
        <path d="M1465 316 L1515 232 L1565 316 Z" fill="none" stroke="#00e5ff" stroke-width="5"/><path d="M1488 316 L1515 268 L1542 316" fill="none" stroke="#38ff6b" stroke-width="5"/>
        <rect x="1600" y="215" width="120" height="110" rx="6" fill="#120d30" stroke="#3b2d78" stroke-width="4"/>
        <circle cx="1660" cy="262" r="26" fill="none" stroke="#ffe600" stroke-width="5"/><path d="M1620 312 H1700" stroke="#ff2bd6" stroke-width="5" stroke-linecap="round"/>
      </g>

      <!-- luz detrás de la tele -->
      <g class="rgb">
        <rect x="92" y="147" width="1016" height="605" rx="30" fill="none" stroke="url(#rgbg)" stroke-width="24" filter="url(#glow)" opacity=".9"/>
        <rect x="96" y="151" width="1008" height="597" rx="28" fill="none" stroke="url(#rgbg)" stroke-width="5"/>
      </g>

      <!-- mueble de la tele -->
      <rect x="90" y="764" width="1030" height="86" rx="12" fill="#1a1238" stroke="#3b2d78" stroke-width="4"/>
      <rect x="90" y="760" width="1030" height="12" rx="6" fill="#3a2b7a"/>
      <rect x="116" y="786" width="420" height="50" rx="6" fill="#0a0818"/>
      <rect x="560" y="786" width="530" height="50" rx="6" fill="#0a0818"/>
      <!-- consola en el hueco izquierdo -->
      <rect x="150" y="800" width="300" height="30" rx="8" fill="#14142a" stroke="#2c2c48" stroke-width="2"/>
      <rect x="170" y="811" width="120" height="6" rx="3" fill="#0a0a14"/>
      <circle class="blink" cx="420" cy="815" r="6" fill="#00e5ff"/>
      <!-- juegos en el hueco derecho -->
      <g>
        <rect x="600" y="797" width="22" height="36" rx="3" fill="#ff2bd6"/><rect x="628" y="797" width="22" height="36" rx="3" fill="#00e5ff"/>
        <rect x="656" y="797" width="22" height="36" rx="3" fill="#ffe600"/><rect x="684" y="797" width="22" height="36" rx="3" fill="#38ff6b"/>
        <rect x="712" y="797" width="22" height="36" rx="3" fill="#7a5cff"/><rect x="740" y="797" width="22" height="36" rx="3" fill="#ff2bd6"/>
      </g>
      <g class="rgb"><rect x="90" y="848" width="1030" height="6" fill="url(#rgbg)" filter="url(#glowS)"/><rect x="90" y="848" width="1030" height="3" fill="url(#rgbg)"/></g>

      <!-- tele (marco) -->
      <rect x="104" y="159" width="992" height="581" rx="22" fill="#0a0a12" stroke="#2c2c48" stroke-width="5"/>
      <rect x="124" y="179" width="952" height="541" rx="14" fill="#000"/>
      <circle class="blink" cx="600" cy="729" r="4" fill="#00e5ff"/>
      <path d="M260 740 L290 764 L350 764 L370 740 Z" fill="#14141f" stroke="#2c2c48" stroke-width="3"/>
      <path d="M830 740 L850 764 L910 764 L940 740 Z" fill="#14141f" stroke="#2c2c48" stroke-width="3"/>

      <!-- joystick en el piso -->
      <g transform="translate(980 930) rotate(-8)">
        <path d="M-70 0 Q-80 -40 -40 -42 H40 Q80 -40 70 0 Q64 34 40 30 L22 12 H-22 L-40 30 Q-64 34 -70 0 Z" fill="#14141f" stroke="#3b2d78" stroke-width="4"/>
        <circle cx="-38" cy="-8" r="9" fill="#0a0a14"/><path d="M-38 -20 V4 M-50 -8 H-26" stroke="#00e5ff" stroke-width="4" stroke-linecap="round"/>
        <circle cx="34" cy="-16" r="6" fill="#ff2bd6"/><circle cx="50" cy="-4" r="6" fill="#ffe600"/><circle cx="34" cy="8" r="6" fill="#38ff6b"/><circle cx="18" cy="-4" r="6" fill="#00e5ff"/>
      </g>

      <rect width="1920" height="1080" fill="url(#vignette)"/>
    </svg>

    <!-- Pantalla de la tele -->
    <div id="screen">
      <div id="screenOn"><div class="bar"></div></div>
      <div class="glare"></div>
    </div>

      <!-- Video + título (dentro de la tele) -->
    <div id="video">
      <div id="yt"></div>
      <div id="demoVid">VIDEO<br>AQUÍ</div>
      <div id="dbg"></div>
    </div>
    <div id="titleWrap"><div id="titleOuter"><div id="title">Ya comenzamos</div></div></div>
    <div id="glare2"></div>

    <!-- Carpincho -->

  // Caída al puff con rebote
  A($('capy'), [
    { transform: 'translateY(-1100px) rotate(-6deg)', easing: 'cubic-bezier(.5,0,1,.6)' },
    { offset: .5, transform: 'translateY(0) rotate(0deg)', easing: 'cubic-bezier(0,.4,.5,1)' },
    { offset: .7, transform: 'translateY(-55px)', easing: 'cubic-bezier(.5,0,1,.6)' },
    { offset: .88, transform: 'translateY(0)' },
    { transform: 'translateY(0)' }
  ], { delay: T_DROP, duration: 1000 });

  // El puff se aplasta al recibirlo
  A($('puff'), [
    { transform: 'scale(1,1)' },
    { offset: .18, transform: 'scale(1.07,.84)' },
    { offset: .45, transform: 'scale(.98,1.05)' },
    { offset: .7, transform: 'scale(1.015,.97)' },
    { transform: 'scale(1,1)' }
  ], { delay: T_DROP + 480, duration: 900, easing: 'ease-out' });

  // Se recuesta
  A($('capyTilt'), [{ transform: 'rotate(0deg)' }, { transform: 'rotate(3.5deg)' }],
    { delay: 1700, duration: 700, easing: 'ease-in-out' });

  // Respiración
  A($('capyBreath'), [{ transform: 'scale(1,1)' }, { transform: 'scale(1.008,1.014)' }],
    { delay: 1500, duration: 3000, direction: 'alternate', iterations: Infinity, easing: 'ease-in-out' });

  // Brillo en los anteojos (dos pasadas)
  [$('shineL'), $('shineR')].forEach((el, i) => {
    A(el, [{ opacity: 0 }, { offset: .35, opacity: 1 }, { opacity: 0 }],
      { delay: 2300 + i * 150, duration: 700, iterations: 2, easing: 'ease-in-out' });
  });


  // La tele se prende (estática)
  A($('screenOn'), [
    { opacity: 0 }, { offset: .2, opacity: 1 }, { offset: .3, opacity: .4 }, { offset: .5, opacity: 1 }, { opacity: 1 }
  ], { delay: T_ON, duration: 500 });

  // Entra el video
  A($('video'), [{ opacity: 0 }, { opacity: 1 }], { delay: T_REVEAL, duration: 600 });

  // Aparece el texto
  A($('title'), [
    { opacity: 0, transform: 'scale(.7)' },
    { offset: .3, opacity: 1, transform: 'scale(1.06)' },
    { offset: .4, opacity: .5 },
    { offset: .5, opacity: 1 },
    { offset: .6, opacity: .7 },
    { offset: .7, opacity: 1, transform: 'scale(1)' },
    { opacity: 1, transform: 'scale(1)' }
  ], { delay: T_TITLE, duration: 1100, easing: 'ease-out' });
  if (HOLD > 0) {
    A($('titleOuter'), [{ opacity: 1 }, { opacity: 0 }], { delay: T_TITLE + 1100 + HOLD * 1000, duration: 800 });
  }

  // Salto de la intro / modo prueba
  if (DESDE > 0) anims.forEach(a => { a.currentTime = DESDE; });
  window.seek = ms => { anims.forEach(a => { a.pause(); a.currentTime = ms; }); };

  // ----- Video -----
  if (DEMO) {
    $('demoVid').style.display = 'flex';
  } else {
    let player = null, ready = false, revealed = false;
    const go = () => {
      if (!player) return;
      try { player.playVideo(); } catch (e) {}
    };
    window.onYouTubeIframeAPIReady = () => {
      const vars = { autoplay: 0, controls: 0, modestbranding: 1, rel: 0, iv_load_policy: 3, disablekb: 1, playsinline: 1, fs: 0, loop: 1 };
      const cfg = { width: 940, height: 529, playerVars: vars,
        events: {
          onReady: () => { ready = true; if (MUTE) player.mute(); if (revealed) go(); },
          onStateChange: e => { if (e.data === 0) { try { player.playVideoAt ? player.playVideoAt(0) : player.playVideo(); } catch (x) {} } },
          onError: e => {
            if (DEBUG) { $('dbg').style.display = 'block'; $('dbg').textContent = 'Error de YouTube ' + e.data + ' (¿el video permite incrustarse?)'; }
            try { player.nextVideo(); } catch (x) {}
          }
        } };
      if (VIDEO) { cfg.videoId = VIDEO; vars.playlist = VIDEO; }
      else { vars.listType = 'playlist'; vars.list = PLAYLIST; }
      player = new YT.Player('yt', cfg);
    };
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
    setTimeout(() => { revealed = true; if (ready) go(); }, Math.max(0, T_REVEAL - DESDE));
  }

  // ----- Ajuste al tamaño de la ventana / fuente de OBS -----
  const stage = $('stage');
  // En OBS el fondo queda transparente; en un navegador normal se rellena de negro y se centra la escena
  if (!window.obsstudio) document.body.style.background = '#000';
  const fit = () => {
    const s = Math.min(innerWidth / 1920, innerHeight / 1080);
    stage.style.left = ((innerWidth - 1920 * s) / 2) + 'px';
    stage.style.top = ((innerHeight - 1080 * s) / 2) + 'px';
    stage.style.transform = `scale(${s})`;
  };
  addEventListener('resize', fit); fit();
})();
</script>
</body>
</html>
